<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<title>Household Budget — Monthly Dashboard</title>
<meta name="theme-color" content="#060807">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#ECF3EE;--ink2:#D5E0D9;--ink3:#B4C3BA;--bg:#060807;--card:#0E1311;--line:#1F2924;--muted:#7D8E85;--soft:#161E1A;
  --gold:#10B981;--gold2:#6EE7B7;--goldsoft:#0D2A1F;
  --red:#F87171;--amber:#FBBF24;--green:#34D399;
  --r:18px;--sh:0 1px 2px rgba(11,18,32,.04),0 8px 28px rgba(11,18,32,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 120px}
/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ink),var(--ink3));display:grid;place-items:center;color:var(--gold2);font-weight:800;font-size:16px;box-shadow:inset 0 0 0 1px rgba(16,185,129,.35)}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.monthsw{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthsw button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--ink3)}
.monthsw button:hover{background:var(--soft)}
.monthsw span{min-width:140px;text-align:center;font-weight:700;font-size:14px}
.spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--card);height:44px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--ink3)}
.iconbtn.on{background:var(--goldsoft);border-color:var(--gold2);color:#A7F3D0}
/* hero */
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(16,185,129,.28),transparent 60%),linear-gradient(160deg,#0F172A 0%,#16213A 60%,#1B2742 100%);color:#fff;border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:24px;box-shadow:0 20px 50px rgba(15,23,42,.25);position:relative;overflow:hidden}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:#CBD5E1;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;min-height:36px}
.seg button.on{background:#fff;color:var(--ink)}
.hlabel{color:#94A3B8;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:18px}
.hbig{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.hsub{color:#94A3B8;font-size:13px;margin-top:6px}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.hstat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hstat b{display:block;font-size:19px;font-weight:700;margin-top:4px}
.hstat>span{font-size:12px;color:#94A3B8;font-weight:600}
.hstat b span{font-size:inherit;font-weight:inherit;color:inherit}
.hstat.gold{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.35)}
.hstat.gold b{color:var(--gold2)}
.ringwrap{display:grid;place-items:center;align-self:center}
.ringwrap .lbl{text-align:center;margin-top:-118px;height:118px;display:flex;flex-direction:column;justify-content:center}
.ringwrap .lbl b{font-size:28px;font-weight:800}
.ringwrap .lbl span{font-size:12px;color:#94A3B8}
.neg{color:#FCA5A5!important}
/* grid & cards */
.grid{display:grid;gap:16px;margin-top:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:1.5fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pri{position:relative;overflow:hidden}
.pri:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.pri .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pri .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);padding:2px 8px;border-radius:999px}
.pri .amt2{font-size:22px;font-weight:800;margin:12px 0 2px;letter-spacing:-.02em}
.pri .of{font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:10px}
.st-ok{color:var(--green)}.st-warn{color:var(--amber)}.st-bad{color:var(--red)}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* tx rows */
.txlist{display:flex;flex-direction:column}
.txrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--soft)}
.txrow:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.txt{font-weight:600;font-size:14px;line-height:1.3}
.txt .shown{display:none}
.txt .hid{color:var(--muted);font-weight:500;font-style:italic}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.amt{position:relative;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:0 14px 0 14px;min-height:40px;min-width:108px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;transition:background .2s,border-color .2s}
.amt:hover{border-color:#CBD5E1}
.amt .real{display:none}
.amt .mask{letter-spacing:.08em;color:var(--ink3)}
.amt svg{display:none;width:18px;height:18px;transform:rotate(-90deg)}
.amt svg circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:50.27;stroke-dashoffset:0;stroke-linecap:round}
.amt svg circle.bg{stroke:#1F3B30}
.open .amt{background:var(--goldsoft);border-color:var(--gold2)}
.open .amt .mask{display:none}
.open .amt .real{display:inline;animation:unblur .35s ease}
.open .amt svg{display:block}
.open .txt .shown{display:inline}
.open .txt .hid{display:none}
@keyframes unblur{from{filter:blur(6px);opacity:.2}to{filter:none;opacity:1}}
.detail{grid-column:1/-1;display:none;background:var(--goldsoft);border:1px solid #1F3B30;border-radius:12px;padding:12px 14px;font-size:13px;animation:drop .25s ease}
.open .detail{display:block}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.detail dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 16px;margin:0}
.detail dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6EE7B7;font-weight:700}
.detail dd{margin:2px 0 0;font-weight:600}
.detail .acts{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:#6EE7B7}
.lnk{border:0;background:transparent;color:var(--red);font-weight:700;font-size:12px;padding:6px 0}
.lnk.plain{color:var(--ink3)}
/* dues */
.due{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--soft)}
.due:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid #CBD5E1;background:#fff;display:grid;place-items:center;margin:0 auto;transition:all .2s}
.chk svg{opacity:0;transform:scale(.6);transition:all .2s}
.paid .chk{background:var(--green);border-color:var(--green)}
.paid .chk svg{opacity:1;transform:none}
.paid .dn{text-decoration:line-through;color:var(--muted)}
.paid .damt{color:var(--muted)}
.dn{font-weight:700;font-size:14px}
.damt{font-weight:800;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-paid{background:#ECFDF5;color:var(--green)}
.c-over{background:#FEF2F2;color:var(--red)}
.c-soon{background:#FFFBEB;color:var(--amber)}
.c-up{background:var(--soft);color:var(--ink3)}
.grouph{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.grid>*,.hero>*{min-width:0}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-size:12px;font-weight:700;position:relative;min-height:44px}
.day small{font-size:10.5px;font-weight:600;color:var(--muted)}
.day.heat1{background:#EEF2FB}.day.heat2{background:#C9D6F5}.day.heat3{background:#7F9BE6;color:#fff}.day.heat3 small{color:#E6ECFB}.day.heat4{background:#2F5BD3;color:#fff}.day.heat4 small{color:#C9D6F5}
.day.sel{outline:2.5px solid var(--gold);outline-offset:1px}
.day.today:after{content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day.fut{opacity:.45}
.legend{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend i{width:16px;height:12px;border-radius:4px;display:inline-block}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:12px;font-weight:700;color:var(--ink3)}
.in{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;min-height:44px;width:100%;outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:600;font-size:13px;min-height:38px;display:flex;align-items:center;gap:6px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:0;background:var(--ink);color:#fff;font-weight:700;border-radius:12px;min-height:46px;padding:0 18px;width:100%}
.btn.gold{background:linear-gradient(135deg,#10B981,#34D399);color:#03140D}
.btn.ghost{background:var(--soft);color:var(--ink)}
.bigamt{font-size:34px;font-weight:800;letter-spacing:-.02em;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0;text-align:left;width:100%;outline:none;background:transparent}
.bigamt:focus{border-color:var(--gold)}
/* modal & fab */
.fab{position:fixed;right:22px;bottom:24px;width:62px;height:62px;border-radius:20px;border:0;background:linear-gradient(135deg,#10B981,#34D399);color:#03140D;font-size:30px;font-weight:500;box-shadow:0 12px 30px rgba(16,185,129,.45);z-index:30;display:grid;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px 26px;max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheethead h2{margin:0;font-size:18px}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;font-size:18px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:all .3s;z-index:60;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--gold2)}
/* misc */
.empty{color:var(--muted);font-size:13px;padding:16px 4px;text-align:center}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.privacy .pv{filter:blur(9px);transition:filter .25s;user-select:none}
.pv{transition:filter .25s}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legendrow span{display:flex;align-items:center;gap:6px}
.donutwrap{display:flex;gap:18px;align-items:center}
.donutlist{flex:1;display:flex;flex-direction:column;gap:8px;font-size:13px}
.donutlist div{display:flex;align-items:center;gap:8px}
.donutlist b{margin-left:auto}
.warnbox{background:#FEF2F2;color:var(--red);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-top:6px}
.okbox{background:#ECFDF5;color:var(--green);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-top:6px}
.bottomnav{display:none}
.incrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--soft);font-size:14px}
.incrow:last-child{border-bottom:0}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--b);color:var(--fg);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 14px -6px var(--b)}
.debt .top2{display:flex;gap:12px;align-items:center}
.debt .nm2{font-weight:700;font-size:15px}
.debt .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:14px 0 2px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn.sm{min-height:42px;font-size:13px;padding:0 14px;width:auto;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.bcard{position:relative;aspect-ratio:1.586;border:0;border-radius:20px;padding:18px 20px;color:var(--fg);text-align:left;background:linear-gradient(135deg,var(--b1),var(--b2));overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px -14px var(--b2),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .3s cubic-bezier(.2,.8,.2,1);isolation:isolate;width:100%}
.bcard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 105% -15%,rgba(255,255,255,.22),transparent 42%);z-index:-1}
.bcard .pat,.bcard .glare{position:absolute;inset:0;z-index:-1;pointer-events:none}
.pat[data-pat=waves]{background:repeating-radial-gradient(circle at 115% 125%,rgba(255,255,255,.08) 0 2px,transparent 2px 16px)}
.pat[data-pat=bubbles]{background:radial-gradient(circle at 88% 18%,rgba(255,255,255,.16) 0 58px,transparent 59px),radial-gradient(circle at 104% 72%,rgba(255,255,255,.10) 0 92px,transparent 93px),radial-gradient(circle at 8% 115%,rgba(255,255,255,.12) 0 70px,transparent 71px)}
.pat[data-pat=mesh]{background:radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--acc) 60%,transparent),transparent 42%),radial-gradient(circle at -5% 105%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 48%)}
.pat[data-pat=grid]{background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--acc) 50%,transparent),transparent 52%),linear-gradient(color-mix(in srgb,var(--acc) 13%,transparent) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,color-mix(in srgb,var(--acc) 13%,transparent) 1px,transparent 1px) 0 0/22px 22px}
.pat[data-pat=lime]{background:radial-gradient(circle at 100% 105%,color-mix(in srgb,var(--acc) 55%,transparent),transparent 45%),repeating-linear-gradient(135deg,color-mix(in srgb,var(--acc) 7%,transparent) 0 1px,transparent 1px 10px)}
.pat[data-pat=circles]{background:radial-gradient(circle at 112% 50%,transparent 0 64px,rgba(255,255,255,.14) 64px 66px,transparent 66px 96px,rgba(255,255,255,.11) 96px 98px,transparent 98px 128px,rgba(255,255,255,.08) 128px 130px,transparent 130px)}
.pat[data-pat=diag]{background:repeating-linear-gradient(120deg,rgba(255,255,255,.055) 0 18px,transparent 18px 36px),radial-gradient(circle at -10% 120%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 50%)}
.glare{opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 45%)}
.bcard.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.bcard.tilting{transition:transform .05s linear}
.bcard.tilting .glare{opacity:1}
.bc-logo{background:color-mix(in srgb,var(--acc) 26%,transparent)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)!important;color:var(--fg)}
.qrph{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
.bc-line{height:2px;width:34px;border-radius:2px;background:var(--acc);margin-top:6px;opacity:.9}
.bcard:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);transform:translateX(-110%);transition:transform 1s;z-index:-1}
.bcard:hover:after{transform:translateX(110%)}
.bc-top{display:flex;align-items:center;gap:10px}
.bc-logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:12px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.bc-logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.bc-bank{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.bc-type{font-size:11px;opacity:.82;font-weight:600;margin-top:2px}
.qrph{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.2);display:flex;gap:5px;align-items:center;white-space:nowrap}
.bc-mid{display:flex;align-items:center;gap:12px}
.chipi{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#F7EBB5,#D4AF37 55%,#6EE7B7);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.chipi:before{content:"";position:absolute;inset:7px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.chipi:after{content:"";position:absolute;inset:0 13px;border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
.bc-num{font-size:17px;font-weight:600;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.bc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bc-bottom small{display:block;font-size:9.5px;opacity:.75;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.bc-bottom b{font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.bc-tap{font-size:11px;font-weight:700;opacity:.9;white-space:nowrap}
.ownerh{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-weight:800;font-size:16px}
.ownerh .av{--c:#6EE7B7}
.addcard{aspect-ratio:1.586;border:2px dashed #CBD5E1;border-radius:20px;background:transparent;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:14px}
.addcard:hover{border-color:var(--gold);color:#A7F3D0;background:var(--goldsoft)}
.qrhead{border-radius:20px;padding:18px 18px 56px;color:var(--fg);background:linear-gradient(135deg,var(--b1),var(--b2));position:relative;overflow:hidden}
.qrpanel{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center;box-shadow:0 14px 34px rgba(15,23,42,.16);margin:-40px 18px 0;position:relative}
.qrpanel img{width:100%;max-width:300px;border-radius:8px}
.noqr{width:100%;max-width:260px;aspect-ratio:1;border:2px dashed #CBD5E1;border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:22px;cursor:pointer}
.noqr:hover{border-color:var(--gold);background:var(--goldsoft)}
.filebtn{display:flex;align-items:center;gap:12px;border:1px dashed #CBD5E1;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink3);min-height:56px}
.filebtn:hover{border-color:var(--gold);background:var(--goldsoft)}
.filebtn img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.vis{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#EEF2FF;color:#4338CA;margin-left:6px;vertical-align:1px}
label.btn{display:grid;place-items:center;cursor:pointer}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(255,255,255,.55);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:18px;overflow:auto}
.side .tabs{display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;border-radius:0}
.side .tabs button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink3);text-align:left;width:100%;min-height:44px}
.side .tabs button:hover{background:var(--soft)}
.side .tabs button.on{background:var(--ink);color:#fff}
body.me .side .tabs button.on{background:#2A2563}
.side .tabs .navsec{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#A3A8B3;padding:14px 12px 6px}
.side .modesw{width:100%}.side .modesw button{flex:1;justify-content:center;padding:8px 6px;font-size:12.5px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.secbox{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px}
.secbox b{display:block;font-size:13px}
.secbox small{color:var(--muted)}
.secbox .ic{flex:none;margin-top:1px;color:var(--gold)}
body.me .secbox .ic{color:#6D5BD0}
.wrap{max-width:1200px;margin:0 auto;padding:22px 28px 120px;width:100%;min-width:0}
.ptitle h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
#psub{color:var(--muted);font-size:13px;margin-top:2px}
.mbrand,.mmode{display:none}
.ic{flex:none;display:block}
.cico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.modesw{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.modesw button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:36px}
.modesw button.on{background:linear-gradient(135deg,#10B981,#34D399);color:#03140D}
body.me .modesw button.on{background:linear-gradient(135deg,#6D5BD0,#8B7CF0);color:#fff}
body.me .hero{background:radial-gradient(1000px 320px at 85% -40%,rgba(167,139,250,.35),transparent 60%),linear-gradient(160deg,#1E1B4B 0%,#2A2563 60%,#312E81 100%)}
body.me .hstat.gold{background:rgba(167,139,250,.16);border-color:rgba(196,181,253,.4)}
body.me .hstat.gold b{color:#DDD6FE}
.mebadge{display:none;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EDE9FE;color:#5B21B6;margin-left:8px;vertical-align:3px}
body.me .mebadge{display:inline-block}
.tip{position:fixed;z-index:80;pointer-events:none;background:rgba(15,23,42,.94);color:#fff;font-size:12.5px;font-weight:600;line-height:1.45;padding:8px 11px;border-radius:10px;box-shadow:0 10px 24px rgba(15,23,42,.3);transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}
.tip b{color:#6EE7B7}
.click{cursor:pointer;transition:transform .2s,box-shadow .2s}
.click:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.05),0 14px 30px rgba(15,23,42,.1)}
.pri .more{position:absolute;right:14px;bottom:12px;font-size:11px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .2s}
.pri:hover .more{opacity:1}
.wk{cursor:pointer;transition:opacity .2s}
svg.flow:hover .wk{opacity:.4}svg.flow .wk:hover{opacity:1}
.dseg{cursor:pointer;transition:stroke-width .2s,opacity .2s}
.donut:hover .dseg{opacity:.45}.donut .dseg:hover{opacity:1;stroke-width:21}
.donutlist div{cursor:pointer;border-radius:8px;padding:3px 6px;margin:0 -6px}
.donutlist div:hover{background:var(--soft)}
.sbar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.sbar .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.sbar .t i{display:block;height:100%;background:var(--c);border-radius:99px}
.sim{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.sim input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.simbig{font-size:28px;font-weight:800;letter-spacing:-.02em}
.simlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.simlist div{display:flex;align-items:center;gap:8px}
.simlist b{margin-left:auto}
.gain{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ECFDF5;color:var(--green);margin-left:6px;vertical-align:4px}
.tl{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin-top:12px}
.tl i{display:block;height:100%}
/* lock screen */
.lockscr{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:radial-gradient(800px 400px at 50% -10%,rgba(139,124,240,.45),transparent 60%),linear-gradient(160deg,rgba(20,16,52,.92),rgba(11,18,32,.96));backdrop-filter:blur(16px);padding:20px}
.lockscr.show{display:grid}
.lockcard{width:100%;max-width:340px;text-align:center;color:#fff}
.lockscr.show{animation:lfade .3s ease}
@keyframes lfade{from{opacity:0}to{opacity:1}}
.lockico{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#DDD6FE}
.lockcard h2{margin:0;font-size:20px;letter-spacing:-.02em}
.lockcard p{margin:6px 0 0;color:#C4B5FD;font-size:13.5px;line-height:1.5}
.pins{display:flex;justify-content:center;gap:14px;margin:26px 0 8px;height:16px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.45);transition:all .15s}
.pins i.f{background:#fff;border-color:#fff;transform:scale(1.1)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lerr{min-height:20px;font-size:12.5px;font-weight:700;color:#FCA5A5}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:10px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:#fff;font-size:24px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .15s}
.pad button:hover{background:rgba(255,255,255,.16)}
.pad button:active{background:rgba(255,255,255,.26)}
.pad button.ghost{background:transparent;box-shadow:none;font-size:14px;font-weight:700}
.lockfoot{margin-top:20px;display:flex;justify-content:center;gap:18px}
.lockfoot button{border:0;background:transparent;color:#C4B5FD;font-weight:700;font-size:13px;padding:10px}
.lockfoot .go{background:#fff;color:#2A2563;border-radius:999px;padding:12px 26px}
/* health + insights + goals */
.score{display:flex;gap:20px;align-items:center}
.score .lbl{position:relative}
.score .lbl div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score .lbl b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .lbl span{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.hrow:last-child{border-bottom:0}
.hrow small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.hrow .mini{grid-column:1/-1;height:5px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}
.hrow .mini i{display:block;height:100%;border-radius:9px}
.ins{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--soft);font-size:13.5px;line-height:1.45}
.ins:last-child{border-bottom:0}
.ins .ii{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.ins.good .ii{background:#E7F5EF;color:var(--green)}.ins.warn .ii{background:#FBF1E1;color:var(--amber)}.ins.info .ii{background:#ECEFFA;color:#2F5BD3}.ins.bad .ii{background:#FCEBE4;color:var(--red)}
.ins b{font-weight:700}
.ins .go{border:0;background:transparent;color:var(--muted);padding:6px}
.goal .gtop{display:flex;gap:12px;align-items:center}
.gico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,white);flex:none}
.gmid{display:flex;gap:16px;align-items:center;margin-top:14px}
.gring{position:relative;flex:none}
.gring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.iconpick button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.iconpick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--c)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.minigoal{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.minigoal .gico{width:30px;height:30px;border-radius:9px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;font-weight:600}
.toggle input{width:44px;height:26px;appearance:none;background:#D6D3CC;border-radius:99px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:#6D5BD0}
.toggle input:checked:before{transform:translateX(18px)}
.morelist button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--soft);border-radius:14px;padding:14px;font-weight:700;font-size:15px;margin-bottom:8px;text-align:left}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}.side{display:none}
  .mbrand{display:flex}.ptitle{display:none}
  .mmode{display:block;margin-bottom:14px}.mmode .modesw{width:100%}.mmode .modesw button{flex:1;justify-content:center}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:25;padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav button{border:0;background:transparent;font-size:10.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;flex:1;min-width:0;min-height:48px}
  .bottomnav button.on{color:var(--ink)}
  .bottomnav button.on .ic{color:var(--gold)}
  body.me .bottomnav button.on .ic{color:#6D5BD0}
  .fab{bottom:84px;right:16px}
  .wrap{padding:14px 16px 120px}
}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g5 .pri:last-child{grid-column:span 2}.g2,.g2e{grid-template-columns:1fr}.hstats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .wrap{padding:14px 14px 120px}
  .tabs{display:none}
  .sim{grid-template-columns:1fr}
  .sbar{grid-template-columns:90px 1fr 76px}
  .g3{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:25;padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav button{border:0;background:transparent;font-size:10.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;flex:1;min-width:0;min-height:48px}
  .bottomnav button.on{color:var(--ink)}
  .fab{bottom:84px;right:16px}
  .hero{grid-template-columns:1fr;padding:20px}
  .ringwrap{display:none}
  .hbig{font-size:36px}
  .monthsw span{min-width:110px}
  .top .iconbtn .t{display:none}
  .due{grid-template-columns:40px 1fr auto}
  .day{padding:5px;border-radius:10px}.day small .w{display:none}
  .cal{gap:4px}
  .amt{min-width:92px;padding:0 10px}
  .due .dchip{grid-column:2/4;justify-self:start;margin-top:-6px}
}

/* ===== Black & Emerald luxury theme ===== */
body{background:radial-gradient(1200px 600px at 100% -10%,rgba(16,185,129,.08),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(16,185,129,.05),transparent 60%),var(--bg);background-attachment:fixed}
::selection{background:rgba(16,185,129,.35)}
.hbig,.ptitle h1,.simbig,.score .lbl b{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em}
.hbig{font-size:48px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--card);border-color:var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -24px rgba(0,0,0,.8)}
.logo{background:linear-gradient(145deg,#0B3D2E,#07170F)!important;color:#6EE7B7!important;box-shadow:inset 0 0 0 1px rgba(110,231,183,.35),0 6px 18px -6px rgba(16,185,129,.5)!important}
.hero{background:radial-gradient(900px 320px at 88% -30%,rgba(16,185,129,.30),transparent 60%),radial-gradient(500px 240px at 0% 120%,rgba(16,185,129,.12),transparent 60%),linear-gradient(160deg,#07110C 0%,#0A1611 55%,#0C1D15 100%)!important;border:1px solid rgba(110,231,183,.14);box-shadow:0 30px 60px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)!important}
body.me .hero{background:radial-gradient(900px 320px at 88% -30%,rgba(45,212,191,.30),transparent 60%),linear-gradient(160deg,#061210 0%,#08181A 55%,#0A2124 100%)!important;border-color:rgba(94,234,212,.16)}
.hstat{background:rgba(255,255,255,.035)!important;border-color:rgba(255,255,255,.07)!important}
.hstat.gold{background:rgba(16,185,129,.12)!important;border-color:rgba(110,231,183,.3)!important}
.hstat.gold b{color:#6EE7B7!important}
body.me .hstat.gold{background:rgba(45,212,191,.12)!important;border-color:rgba(94,234,212,.3)!important}
body.me .hstat.gold b{color:#5EEAD4!important}
.seg{background:rgba(255,255,255,.06)}
.seg button.on{background:linear-gradient(135deg,#10B981,#059669)!important;color:#03140D!important}
body.me .seg button.on{background:linear-gradient(135deg,#2DD4BF,#14B8A6)!important}
.hlabel{color:#7FA392}
.side{background:rgba(8,11,9,.75)!important;border-color:var(--line)!important}
.side .tabs button{color:var(--ink3)}
.side .tabs button.on,body.me .side .tabs button.on{background:linear-gradient(90deg,rgba(16,185,129,.18),rgba(16,185,129,.04))!important;color:#ECF3EE!important;box-shadow:inset 2px 0 0 #10B981}
body.me .side .tabs button.on{background:linear-gradient(90deg,rgba(45,212,191,.18),rgba(45,212,191,.04))!important;box-shadow:inset 2px 0 0 #2DD4BF}
.side .tabs button.on .ic{color:#34D399}
body.me .side .tabs button.on .ic{color:#5EEAD4}
.side .tabs .navsec{color:#4F6158}
.modesw,.monthsw,.iconbtn,.tabs{background:var(--card)!important;border-color:var(--line)!important}
.modesw button.on{background:linear-gradient(135deg,#10B981,#059669)!important;color:#03140D!important}
body.me .modesw button.on{background:linear-gradient(135deg,#2DD4BF,#0D9488)!important;color:#021412!important}
.monthsw button{color:var(--ink3)}
.iconbtn.on{background:#0D2A1F!important;border-color:#10B981!important;color:#6EE7B7!important}
.btn{background:linear-gradient(135deg,#10B981,#059669);color:#03140D}
.btn.gold{background:linear-gradient(135deg,#34D399,#10B981 50%,#047857)!important;color:#03140D!important;box-shadow:0 10px 24px -10px rgba(16,185,129,.6)}
.btn.ghost{background:var(--soft)!important;color:var(--ink)!important;border:1px solid var(--line)}

.paid .chk{background:#10B981!important;border-color:#10B981!important}

.tag{background:rgba(91,141,239,.14)!important;color:#93B4F5!important}
.mebadge{background:rgba(45,212,191,.14)!important;color:#5EEAD4!important}

.open .amt{background:#0D2A1F!important;border-color:#10B981!important;color:#ECF3EE}
.amt svg circle.bg{stroke:#1F3B30}
.detail{background:#0B1F17!important;border-color:#1F3B30!important}
.detail dt{color:#6EE7B7!important}
.day.heat1{background:#0F2A20!important}.day.heat2{background:#14532D!important}.day.heat3{background:#059669!important;color:#fff}.day.heat4{background:#34D399!important;color:#03140D}.day.heat4 small{color:#065F46}.day.heat3 small{color:#D1FAE5}
.day.sel{outline-color:#6EE7B7}

/* 3-way merge: keep both phones' changes, item by item */
function idmap(a){const m={};(a||[]).forEach(x=>{if(x&&x.id!=null)m[x.id]=x});return m}
function merge3(base,local,server){
  base=base||{};local=local||{};const out=clone(server)||{};
  new Set([...Object.keys(local),...Object.keys(base)]).forEach(k=>{
    const b=base[k],l=local[k],s=out[k];
    const isCol=Array.isArray(l)&&l.every(x=>x&&typeof x==='object'&&'id' in x)&&(s===undefined||Array.isArray(s));
    if(isCol){
      const bm=idmap(b),lm=idmap(l),sm=idmap(s);
      Object.keys(bm).forEach(id=>{if(!lm[id])delete sm[id]});
      Object.keys(lm).forEach(id=>{if(!bm[id]||JSON.stringify(bm[id])!==JSON.stringify(lm[id]))sm[id]=lm[id]});
      const seen={};out[k]=[...(s||[]).map(x=>x.id),...l.map(x=>x.id)].filter(id=>sm[id]&&!seen[id]&&(seen[id]=1)).map(id=>sm[id]);
    }else if(l&&typeof l==='object'&&!Array.isArray(l)&&s&&typeof s==='object'&&!Array.isArray(s)&&b&&typeof b==='object'){
      out[k]=merge3(b,l,s);
    }else if(JSON.stringify(b)!==JSON.stringify(l))out[k]=l;
  });
  return out;
}

  if(S.settings.daily&&S.settings.daily[old]){S.settings.daily[nv]=S.settings.daily[old];delete S.settings.daily[old]}
  S.wallet.forEach(w=>{if(w.name===old)w.name=nv});
}
function syncNames(){(MEMBERS||[]).forEach(m=>{const i=m.earner_index;if(i>1)return;const old=S.settings.earners[i];if(old!==m.display_name){renameEarner(old,m.display_name);S.settings.earners[i]=m.display_name}})}

async function fetchDoc(kind){
  let q=SB.from('docs').select('id,kind,data,version,owner').eq('household_id',HH.id).eq('kind',kind);
  if(kind==='private')q=q.eq('owner',ME_UID);
  const{data,error}=await q.maybeSingle();if(error)throw error;return data;
}
async function fetchImages(){
  const{data,error}=await SB.from('images').select('key,sig').eq('household_id',HH.id);if(error)return;
  const need=(data||[]).filter(i=>IMGSIG[i.key]!==i.sig).map(i=>i.key);if(!need.length)return;
  const{data:full}=await SB.from('images').select('key,sig,data').eq('household_id',HH.id).in('key',need);
  (full||[]).forEach(i=>{IMGC[i.key]=i.data;IMGSIG[i.key]=i.sig});
}
/* pull both docs, merge with any unsaved local changes, rebuild the app state */
async function pullAll(){
  const L=S?splitState():null,rows={shared:await fetchDoc('shared'),private:await fetchDoc('private')};
  await fetchImages();
  const next={},changedLocal={};
  ['shared','private'].forEach(k=>{
    const r=rows[k];if(!r)return;const d=DOCS[k],lpart=L?(k==='shared'?L.shared:L.priv):null;
    const localDirty=!!(d&&lpart&&JSON.stringify(lpart)!==d.sent);
    next[k]=localDirty?merge3(d.baseObj,lpart,r.data):r.data;
    changedLocal[k]=localDirty;
    DOCS[k]={id:r.id,version:r.version,baseObj:r.data,sent:JSON.stringify(r.data)};
  });
  return{next,dirty:changedLocal.shared||changedLocal.private};
}
async function refreshFromServer(){
  if(!SB||!HH||saving){pending=true;return}
  try{const{next,dirty:d}=await pullAll();if(!next.shared||!next.shared.v)return;
    rebuild(next.shared,next.private);render();lastSync=Date.now();setSync('ok');saveCache();if(d)save();
  }catch(e){setSync('err')}
}
async function saveDoc(kind,obj,json){
  const d=DOCS[kind];if(!d)return;
  let{data:nv,error}=await SB.rpc('save_doc',{p_id:d.id,p_data:obj,p_base:d.version});if(error)throw error;
  if(nv===-1){
    const r=await fetchDoc(kind),merged=merge3(d.baseObj,obj,r.data);
    ({data:nv,error}=await SB.rpc('save_doc',{p_id:d.id,p_data:merged,p_base:r.version}));if(error)throw error;
    if(nv===-1)throw new Error('RETRY');
    DOCS[kind]={id:d.id,version:nv,baseObj:merged,sent:JSON.stringify(merged)};return true;
  }
  DOCS[kind]={id:d.id,version:nv,baseObj:obj,sent:json};return false;
}
async function pushState(){
  if(!SB||!HH||!S)return;if(saving){dirty=true;return}
  const{shared,priv,imgs}=splitState(),sj=JSON.stringify(shared),pj=JSON.stringify(priv);
  const need=(DOCS.shared&&sj!==DOCS.shared.sent)||(DOCS.private&&pj!==DOCS.private.sent)||Object.keys(imgs).length;
  saveCache();if(!need)return;
  if(!navigator.onLine){setSync('err');return}
  saving=true;dirty=false;setSync('saving');let merged=false;
  try{
    for(const key of Object.keys(imgs)){const{error}=await SB.from('images').upsert({household_id:HH.id,key,sig:sigOf(imgs[key]),data:imgs[key],updated_at:new Date().toISOString()});if(error)throw error;IMGSIG[key]=sigOf(imgs[key])}
    if(DOCS.shared&&sj!==DOCS.shared.sent)merged=(await saveDoc('shared',shared,sj))||merged;
    if(DOCS.private&&pj!==DOCS.private.sent)merged=(await saveDoc('private',priv,pj))||merged;
    lastSync=Date.now();setSync('ok');
    if(merged){rebuild(DOCS.shared.baseObj,DOCS.private.baseObj);render();toast('Merged with changes from the other phone')}
  }catch(e){setSync('err');setTimeout(pushState,6000)}
  saving=false;saveCache();
  if(dirty)pushState();else if(pending){pending=false;refreshFromServer()}
}
const save=()=>{
  try{localStorage.setItem(UIKEY,JSON.stringify(Object.assign({},S.ui,{who:'house'})))}catch(e){}
  if(!SB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(e&&e.name==='QuotaExceededError')setTimeout(()=>toast('Storage full — try smaller QR images'),0)}return}
  clearTimeout(save.t);save.t=setTimeout(pushState,500);
};
function restoreUi(){try{const u=JSON.parse(localStorage.getItem(UIKEY));if(u)Object.assign(S.ui,u,{who:'house'})}catch(e){}if(!S.ui.month)S.ui.month=CURM}
function subscribe(){
  if(chan||!SB||!HH)return;
  chan=SB.channel('docs-'+HH.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'docs',filter:'household_id=eq.'+HH.id},p=>{
    if(p.new&&p.new.updated_by===ME_UID)return;
    const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&main.contains(a)){pending=true;return}
    refreshFromServer();
  }).subscribe();
  pollT=setInterval(async()=>{if(document.hidden||saving||!navigator.onLine)return;
    try{const{data}=await SB.from('docs').select('kind,version').eq('household_id',HH.id);
      if((data||[]).some(r=>DOCS[r.kind]&&r.version!==DOCS[r.kind].version))refreshFromServer();}catch(e){}},45000);
  window.addEventListener('online',()=>{setSync('saving');refreshFromServer().then(pushState)});
  window.addEventListener('offline',()=>setSync('err'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pending){pending=false;refreshFromServer()}});
}

  else if(mode==='msg')b.innerHTML=`<div class="bootcard">${logo}<h2>One moment</h2><p>${msg}</p><button class="btn gold" onclick="location.reload()">Try again</button></div>`;
  else if(mode==='signin')b.innerHTML=`<div class="bootcard">${logo}<h2>Household Budget</h2><p>Sign in to your account</p>${err}

    <form id="authForm" data-am="signup"><input class="in" id="aName" placeholder="Your first name (e.g. Axcel)" required maxlength="24"><input class="in" id="aEmail" type="email" autocomplete="email" placeholder="Email" required><input class="in" id="aPass" type="password" autocomplete="new-password" placeholder="Password (8+ characters)" required minlength="8">

function hideBoot(){document.getElementById('bootscr').classList.remove('show')}

function displayName(u){return(u.user_metadata&&u.user_metadata.name)||(u.email||'Me').split('@')[0]}
async function afterSignIn(user,fromCache){
  ME_UID=user.id;ME_EMAIL=user.email||'';
  const{data:mem,error}=await SB.from('members').select('household_id,user_id,display_name,earner_index');
  if(error){if(fromCache)return setSync('err');return bootScreen('msg','Can\'t reach the server. Check your connection.')}
  const mine=(mem||[]).find(m=>m.user_id===user.id);
  if(!mine)return bootScreen('household');
  MYIDX=mine.earner_index;MEMBERS=mem.filter(m=>m.household_id===mine.household_id);
  const{data:h}=await SB.from('households').select('*').eq('id',mine.household_id).single();HH=h;
  try{
    const{next,dirty:d}=await pullAll();
    if(!next.shared||!next.shared.v){
      if(MYIDX===0)return bootScreen('first');
      bootScreen('wait');subscribeWait();return;
    }
    rebuild(next.shared,next.private);restoreUi();finishBoot();subscribe();saveCache();if(d)save();
  }catch(e){if(fromCache)setSync('err');else bootScreen('msg','Couldn\'t load your budget. '+(e.message||''))}
}
function subscribeWait(){const t=setInterval(async()=>{const r=await fetchDoc('shared').catch(()=>null);if(r&&r.data&&r.data.v){clearInterval(t);location.reload()}},4000)}
async function boot(){
  if(!SB){
    if(CFG){bootScreen('msg','The app isn\'t connected to its database yet.');return}
    let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}migrate(x);restoreUi();finishBoot();return;
  }
  const c=loadCache();let shown=false;
  if(c&&c.hh&&c.docs&&c.docs.shared&&c.local){
    ME_UID=c.uid;ME_EMAIL=c.email;HH=c.hh;MEMBERS=c.members||[];MYIDX=c.myidx||0;DOCS=c.docs;
    try{rebuild(c.local.shared,c.local.priv);restoreUi();finishBoot();shown=true}catch(e){}
  }
  if(!shown)bootScreen('load');
  const{data:{session}}=await SB.auth.getSession();
  if(!session){if(shown&&!navigator.onLine)return;return bootScreen('signin')}
  if(shown&&!navigator.onLine){subscribe();return}
  await afterSignIn(session.user,shown);
}
document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id!=='authForm'&&f.id!=='joinForm')return;e.preventDefault();e.stopImmediatePropagation();
  const v=id=>(document.getElementById(id)||{}).value||'';
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Please wait…';
  try{
    if(f.id==='joinForm'){
      const{data:{user}}=await SB.auth.getUser();
      const{error}=await SB.rpc('join_household',{p_code:v('jCode'),p_display:displayName(user)});
      if(error)return bootScreen('household',/BAD_CODE/.test(error.message)?'That code doesn\'t match any household.':/FULL/.test(error.message)?'That household already has two members.':error.message);
      return afterSignIn(user,false);
    }
    if(f.dataset.am==='signup'){
      const{data,error}=await SB.auth.signUp({email:v('aEmail').trim(),password:v('aPass'),options:{data:{name:v('aName').trim()},emailRedirectTo:location.origin}});
      if(error)return bootScreen('signup',error.message);
      if(!data.session)return bootScreen('check','We sent a confirmation link to <b>'+esc(v('aEmail'))+'</b>. Open it, then come back and sign in.');
      return afterSignIn(data.user,false);

    const{data,error}=await SB.auth.signInWithPassword({email:v('aEmail').trim(),password:v('aPass')});
    if(error)return bootScreen('signin',/confirm/i.test(error.message)?'Please confirm your email first (check your inbox).':'Wrong email or password.');
    bootScreen('load');await afterSignIn(data.user,false);
  }catch(err){bootScreen('msg',err.message||'Something went wrong.')}
},true);

function ensureMonth(m){
  if(!S.dues.some(d=>d.month===m&&!d.debtId&&!d.insId)){
    const prev=[...new Set(S.dues.filter(d=>!d.debtId&&!d.insId).map(d=>d.month))].filter(x=>x<m).sort().pop();
    if(prev){const ld=lastDay(m);S.dues.filter(d=>d.month===prev&&d.recurring&&!d.debtId&&!d.insId).forEach(d=>S.dues.push({...d,id:uid(),month:m,day:Math.min(d.day,ld),paid:false,datePaid:null,payer:null}))}
  }
  syncDebtDues(S,m);syncInsDues(S,m);
}

function hexRgb(h){h=(h||'#334155').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function fgFor(h){const[r,g,b]=hexRgb(h);return (0.299*r+0.587*g+0.114*b)/255>0.62?'#0F172A':'#fff'}
function shade(h,f){const[r,g,b]=hexRgb(h);f=f??.5;return'#'+[r,g,b].map(v=>pad(Math.round(v*(1-f)).toString(16))).join('')}
const initials=t=>{const w=String(t||'?').trim().split(/\s+/);return(w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase()};
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function addMonths(m,k){const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+k,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`}

function compressImage(file,max,type,cb){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.imageSmoothingEnabled=type!=='image/jpeg';x.drawImage(img,0,0,c.width,c.height);cb(c.toDataURL(type,.92))};img.onerror=()=>toast('That file could not be read as an image');img.src=fr.result};fr.readAsDataURL(file);
}

const isMe=()=>!!(S&&S.ui&&S.ui.who==='me');
const ME=()=>S.settings.earners[S.settings.me||0];
const splitF=()=>(S.settings.split??50)/100;
function wOwner(o){if(!isMe())return 1;if(o===ME())return 1;if(o==='Joint')return splitF();return 0}
const wTx=t=>t.shared?(isMe()?splitF():1):wOwner(t.by),wInc=i=>wOwner(i.earner),wDue=d=>wOwner(dueOwner(d));
const allocFor=()=>isMe()?S.settings.allocMe:S.settings.alloc;
const debtsInView=()=>S.debts.filter(d=>wOwner(d.owner)>0);
const hasPin=()=>!!(S&&S.sec&&S.sec.hash);
function isPrivateTx(t){return !!t.stub||(!isMe()&&hasPin()&&S.sec.private&&t.by===ME()&&!t.dueId&&!t.shared)}
function acctBal(w){return (+w.opening||0)+sum(S.income.filter(i=>i.acct===w.id&&i.date<=TODAY),i=>i.amount)-sum(S.tx.filter(t=>t.acct===w.id),t=>t.amount)}
function acctMonthUse(w){return sum(S.tx.filter(t=>t.acct===w.id&&t.date.slice(0,7)===S.ui.month),t=>t.amount)}
const isCredit=w=>w.type==='Credit card';
function isWorkday(date){const[y,m,d]=date.split('-').map(Number),dow=new Date(y,m-1,d).getDay(),wd=S.settings.workdays||'mon-sat';return wd==='all'?true:wd==='mon-fri'?(dow>0&&dow<6):dow>0}
function dailyFor(name){return (S.settings.daily||{})[name]||{allow:0,fare:0}}
function dailyStat(name,date){const cfg=dailyFor(name),wk=isWorkday(date);const tx=S.tx.filter(t=>t.by===name&&t.date===date);
  return{allowB:wk?+cfg.allow||0:0,fareB:wk?+cfg.fare||0:0,allowU:sum(tx.filter(t=>t.sub==='Daily allowance'),t=>t.amount),fareU:sum(tx.filter(t=>t.sub==='Transport fare'),t=>t.amount),wk}}
function monthDaily(name){const m=S.ui.month,ld=lastDay(m);let wd=0;for(let d=1;d<=ld;d++)if(isWorkday(`${m}-${pad(d)}`))wd++;const cfg=dailyFor(name),tx=S.tx.filter(t=>t.by===name&&t.date.slice(0,7)===m);
  return{wd,budget:wd*((+cfg.allow||0)+(+cfg.fare||0)),used:sum(tx.filter(t=>t.sub==='Daily allowance'||t.sub==='Transport fare'),t=>t.amount)}}
function allowanceCard(date){
  const people=isMe()?[ME()]:S.settings.earners;date=date||TODAY;
  const meter=(lbl,icon,u,b,col)=>{const left=b-u,p=b?Math.min(100,u/b*100):0;return`<div class="meter"><div class="mh">${ico(icon,15)}<span>${lbl}</span><b class="pv ${left<0?'neg2':''}">${b?(left<0?`${peso(-left)} over`:`${peso(left)} left`):'Rest day'}</b></div><div class="bar" style="--c:${left<0?'#F87171':col};height:7px"><i style="width:${p}%"></i></div><div class="mf"><span class="pv">${peso(u)}</span> of <span class="pv">${peso(b)}</span></div></div>`};
  return`<div class="card allow"><div class="ch"><div><h3 style="display:flex;gap:8px;align-items:center">${ico('cash',17)}Allowance & fare · ${date===TODAY?'Today':dLabel(date)}</h3><div class="sub">Daily baon and transportation budget per person — every peso logged is deducted right away</div></div><button class="lnk plain" data-view="settings">Set amounts →</button></div>
    <div class="allowgrid">${people.map(n=>{const st=dailyStat(n,date),md=monthDaily(n);return`<div class="person"><div class="ph"><div class="av" style="--c:#10B981">${esc(initials(n))}</div><div><b>${esc(n)}</b><div class="meta">Month: <span class="pv">${peso(md.used)}</span> of <span class="pv">${peso(md.budget)}</span> · ${md.wd} workdays</div></div></div>
      <div class="meters">${meter('Allowance','cash',st.allowU,st.allowB,'#10B981')}${meter('Transport fare','bus',st.fareU,st.fareB,'#5B8DEF')}</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost sm" data-act="quickLog" data-sub="Daily allowance" data-pp="${esc(n)}" data-date="${date}">${ico('plus',14)} Meal / baon</button><button class="btn ghost sm" data-act="quickLog" data-sub="Transport fare" data-pp="${esc(n)}" data-date="${date}">${ico('plus',14)} Fare</button></div></div>`}).join('')}</div></div>`;
}

function monthsUntil(ym){const[a,b]=CURM.split('-').map(Number),[c,d]=ym.split('-').map(Number);return (c*12+d)-(a*12+b)}

function cnt(k,v,cls){return`<span class="num pv ${cls||''}" data-count="${v}" data-k="${S.ui.who}-${k}">${peso(v)}</span>`}
function animateCounts(){setTimeout(()=>prevVals.__init=1,0);document.querySelectorAll('[data-count]').forEach(el=>{const k=el.dataset.k.replace(/^(house|me)-/,''),to=+el.dataset.count,from=prevVals[k]??0;prevVals[k]=to;if(Math.abs(from-to)<1){el.textContent=peso(to);return}if(to<from&&prevVals.__init){el.classList.remove('down');void el.offsetWidth;el.classList.add('down')}const t0=performance.now(),D=750;const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=peso(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step);else el.textContent=peso(to)};requestAnimationFrame(step)})}
const tipAmt=v=>S.ui.privacy?'₱ •••':peso(v);
function inScope(date,scope){scope=scope||S.ui.scope;if(date.slice(0,7)!==S.ui.month)return false;return scope==='month'||cutOf(date)===scope}
function calc(scope){
  scope=scope||S.ui.scope;const m=S.ui.month;
  const inc=S.income.filter(i=>inScope(i.date,scope)&&wInc(i)>0);
  const tx=S.tx.filter(t=>inScope(t.date,scope)&&wTx(t)>0);
  const income=sum(inc,i=>i.amount*wInc(i));
  const received=sum(inc.filter(i=>i.date<=TODAY),i=>i.amount*wInc(i));
  const spent=sum(tx,t=>t.amount*wTx(t));
  const by={};CATS.forEach(c=>by[c]=sum(tx.filter(t=>t.cat===c),t=>t.amount*wTx(t)));
  const A=allocFor(),alloc={};CATS.forEach(c=>alloc[c]=income*(A[c]||0)/100);
  const dues=S.dues.filter(d=>d.month===m&&wDue(d)>0&&(scope==='month'||(d.day<=15?'1st':'2nd')===scope));
  const unpaid=sum(dues.filter(d=>!d.paid),d=>d.amount*wDue(d));
  const remaining=income-spent;
  let safe=null,daysLeft=null;
  if(m===CURM&&(scope==='month'||scope===cutOf(TODAY))){
    const td=+TODAY.slice(8,10),end=scope==='1st'?15:lastDay(m);
    daysLeft=Math.max(1,end-td+1);
    const flex=Math.max(0,alloc.Wants-by.Wants)+Math.max(0,alloc.Buffer-by.Buffer);
    safe=flex/daysLeft;
  }
  return{inc,tx,income,received,spent,by,alloc,dues,unpaid,remaining,after:remaining-unpaid,safe,daysLeft};
}
function dueStatus(d){
  if(d.paid)return['Paid','c-paid'];
  const date=`${d.month}-${pad(d.day)}`;
  if(date<TODAY)return['Overdue','c-over'];
  const n=daysBetween(TODAY,date);
  if(n<=3)return[n===0?'Due today':`Due in ${n}d`,'c-soon'];
  return['Upcoming','c-up'];
}

function smooth(p){if(!p.length)return'';let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=Math.min(p1[1],p1[1]+(p2[1]-p0[1])/6),c2x=p2[0]-(p3[0]-p1[0])/6,c2y=Math.max(p2[1],p2[1]-(p3[1]-p1[1])/6);d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function paceData(){
  const c=calc('month');
  const m=S.ui.month,ld=lastDay(m),a=1,b=ld;
  const days=[];for(let d=a;d<=b;d++)days.push(d);

function debtCard(d){
  const bal=Math.max(0,debtBalance(S,d)),paid=d.original-bal,p=d.original?paid/d.original*100:0;
  const due=S.dues.find(x=>x.debtId===d.id&&x.month===S.ui.month);
  const[st,cl]=bal<=0?['Paid off','c-paid']:due?dueStatus(due):['No due this month','c-up'];
  const months=d.monthly&&bal>0?Math.ceil(bal/d.monthly):0;
  const curDue=S.dues.find(x=>x.debtId===d.id&&x.month===CURM);
  const endM=addMonths(CURM,months-(curDue&&!curDue.paid?1:0));
  const fg=fgFor(d.color),barC=fg==='#0F172A'?shade(d.color,.25):d.color;
  return`<div class="card debt click" data-tip="${esc(`${Math.round(p)}% paid · ${tipAmt(paid)} of ${tipAmt(d.original)}`)}">

    <div class="big num pv">${peso(bal)}</div><div class="meta">left of <span class="pv num">${peso(d.original)}</span> · ${Math.round(p)}% paid</div>
    <div class="bar" style="--c:${barC}"><i style="width:${Math.min(100,p)}%"></i></div>
    <div style="margin-top:12px">
      <div class="kv"><span>Monthly installment</span><b class="num pv">${peso(d.monthly)}</b></div>
      <div class="kv"><span>Due date</span><b>Every ${ord(d.day)}</b></div>
      <div class="kv"><span>Paid off by</span><b>${bal<=0?'Done 🎉':`${mShort(endM)} · ${months} mo left`}</b></div>
    </div>
    <div class="btnrow">${bal>0?`<button class="btn ghost sm" data-act="openPay" data-id="${d.id}">Extra payment</button>`:''}<button class="btn ghost sm" data-act="openDebt" data-id="${d.id}">Edit</button></div>
  </div>`;

function simulate(extra){
  const ds=debtsInView().map(d=>({id:d.id,name:d.name,color:d.color,bal:Math.max(0,debtBalance(S,d)),pay:d.monthly,done:0})).filter(d=>d.bal>0);
  let m=0;
  while(ds.some(d=>d.bal>0)&&m<240){m++;
    const freed=extra>0?sum(ds.filter(d=>d.done&&d.done<m),d=>d.pay):0;
    ds.forEach(d=>{if(d.bal<=0)return;d.bal-=Math.min(d.pay,d.bal);if(d.bal<=0)d.done=m});
    let pool=extra+freed;
    if(pool>0)ds.filter(d=>d.bal>0).sort((a,b)=>a.bal-b.bal).forEach(d=>{if(pool<=0)return;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p;if(d.bal<=0)d.done=m});
  }
  return{months:m,list:ds.sort((a,b)=>a.done-b.done)};
}
function whatIfHtml(extra){
  const base=simulate(0),r=simulate(extra),saved=base.months-r.months;
  return`<div class="meta">Extra per month: <b class="num" style="color:var(--ink)">${peso(extra)}</b></div>
  <div class="simbig">Debt-free by ${mShort(addMonths(CURM,r.months))}${saved>0?`<span class="gain">${saved} mo sooner</span>`:''}</div>
  <div class="tl">${r.list.map(d=>`<i style="width:${100/r.list.length}%;background:${d.color};opacity:${.45+.55*(1-d.done/(r.months||1))}" data-tip="${esc(`${d.name} cleared <b>${mShort(addMonths(CURM,d.done))}</b>`)}"></i>`).join('')}</div>
  <div class="simlist" style="margin-top:12px">${r.list.map(d=>`<div><span class="dotc" style="--c:${d.color}"></span>${esc(d.name)}<b>${mShort(addMonths(CURM,d.done))}</b></div>`).join('')}</div>`;
}

function health(){
  const c=calc('month'),inc=c.income||0;
  const sr=inc?c.by.Savings/inc:0;
  const debtMon=sum(debtsInView().filter(d=>debtBalance(S,d)>0),d=>d.monthly*wOwner(d.owner)),dti=inc?debtMon/inc:0;
  const efund=sum(goalsInView().filter(g=>g.icon==='shield'),g=>goalSaved(g)*wOwner(g.owner)),needsMon=Math.max(1,c.alloc.Needs||c.by.Needs||1),efm=efund/needsMon;
  const overdue=c.dues.filter(d=>!d.paid&&`${d.month}-${pad(d.day)}`<TODAY).length;
  const over=CATS.filter(k=>k!=='Savings'&&c.by[k]>c.alloc[k]+.5);
  const P=v=>Math.round(v*100)+'%';
  const parts=[
    {k:'Savings rate',d:P(sr),t:'target 20%+',p:Math.min(1,sr/.2),max:25},
    {k:'Debt-to-income',d:P(dti),t:'keep under 20%',p:dti<=.2?1:dti>=.5?0:1-(dti-.2)/.3,max:25},
    {k:'Emergency fund',d:efm.toFixed(1)+' months',t:'build to 3–6 months of needs',p:Math.min(1,efm/3),max:25},
    {k:'Bills on time',d:overdue?overdue+' overdue':'All on time',t:'no overdue dues',p:overdue?0:1,max:15},
    {k:'Within budget',d:over.length?over.join(', ')+' over':'All within',t:'no priority over its share',p:Math.max(0,1-over.length*.4),max:10}];
  const score=Math.round(sum(parts,x=>x.p*x.max));
  return{score,parts,c,sr,dti,efm,efund,needsMon,overdue,debtMon,label:score>=80?'Excellent':score>=65?'Healthy':score>=50?'Fair':'Needs attention'};
}
function insights(h){
  const out=[],c=h.c,m=S.ui.month;
  if(m===CURM&&c.income){
    const td=+TODAY.slice(8),ld=lastDay(m);
    const flex=sum(c.tx.filter(t=>!t.dueId&&!['Goal','Debt'].includes(t.sub)),t=>t.amount*wTx(t));
    const proj=flex/td*ld+sum(c.dues,d=>d.amount*wDue(d))+sum(c.tx.filter(t=>!t.dueId&&['Goal','Debt'].includes(t.sub)),t=>t.amount*wTx(t));
    const end=c.income-proj;
    out.push(end>=0?{i:'trendup',tone:'good',h:`At this pace you'll end ${mName(m).split(' ')[0]} with about <b class="pv">${peso(Math.round(end/100)*100)}</b> unspent. Move it to a goal on payday.`,v:'goals'}
                   :{i:'alert',tone:'bad',h:`At this pace, money out (bills, debts, savings transfers and spending) runs about <b class="pv">${peso(Math.round(-end/100)*100)}</b> over income this month. Trim Wants/Buffer or lower a transfer.`,v:'daily'});
    const expW=c.alloc.Wants*td/ld;
    if(c.by.Wants>expW*1.1)out.push({i:'sparkle',tone:'warn',h:`Wants is ahead of plan — <b class="pv">${peso(c.by.Wants)}</b> used vs <b class="pv">${peso(Math.round(expW))}</b> expected by today.`,v:'daily'});
  }
  const soon=c.dues.filter(d=>!d.paid&&`${d.month}-${pad(d.day)}`>=TODAY).sort((a,b)=>a.day-b.day)[0];
  if(soon){const n=daysBetween(TODAY,`${soon.month}-${pad(soon.day)}`);if(n<=5)out.push({i:'bolt',tone:'info',h:`<b>${esc(soon.name)}</b> (${peso(soon.amount*wDue(soon))}) is due ${n===0?'today':`in ${n} day${n>1?'s':''}`}. Tick it in Dues once paid.`,v:'dues'})}
  if(h.overdue)out.push({i:'alert',tone:'bad',h:`${h.overdue} bill${h.overdue>1?'s are':' is'} overdue. Late fees on pay-later and cards add up fast — clear these first.`,v:'dues'});
  if(debtsInView().some(d=>debtBalance(S,d)>0)){const b=simulate(0),x=simulate(1000),g=b.months-x.months;if(g>0)out.push({i:'trend',tone:'info',h:`Putting an extra <b>₱1,000/month</b> on the smallest debt makes you debt-free <b>${g} month${g>1?'s':''} sooner</b> (${mShort(addMonths(CURM,x.months))}).`,v:'debts'})}
  if(h.efm<3){const need=Math.max(0,3*h.needsMon-h.efund);out.push({i:'shield',tone:'warn',h:`Your emergency fund covers <b>${h.efm.toFixed(1)} months</b> of needs. <b class="pv">${peso(Math.round(need/1000)*1000)}</b> more reaches the 3-month safety line.`,v:'goals'})}
  else out.push({i:'shield',tone:'good',h:`Emergency fund covers <b>${h.efm.toFixed(1)} months</b> of needs — solid. Extra savings can go to growth goals.`,v:'goals'});
  const ws={};c.tx.filter(t=>t.cat==='Wants').forEach(t=>ws[t.sub]=(ws[t.sub]||0)+t.amount*wTx(t));const top=Object.entries(ws).sort((a,b)=>b[1]-a[1])[0];
  if(top)out.push({i:SUBICON[top[0]]||'sparkle',tone:'info',h:`<b>${esc(top[0])}</b> is your biggest want this month at <b class="pv">${peso(top[1])}</b>.`,v:'daily'});
  return out.slice(0,5);
}

function shareOf(name){const sp=splitF();return name===ME()?sp:1-sp}

const POL_TYPES=['HMO','Life','Gov\'t health','Accident','Critical illness','Other'];
const POL_ICON={HMO:'pulse',Life:'shield','Gov\'t health':'heart',Accident:'alert','Critical illness':'pill',Other:'dots'};
const POL_COL={HMO:'#10B981',Life:'#5B8DEF','Gov\'t health':'#F27A9B',Accident:'#FBBF24','Critical illness':'#A78BFA',Other:'#94A39B'};
const polInView=()=>S.policies.filter(p=>wOwner(p.owner)>0);
function annualIncome(n){return sum(S.income.filter(i=>i.earner===n&&i.date.slice(0,7)===S.ui.month&&(i.source==='Salary'||i.source==='Overtime')),i=>i.amount)*12}
function nextPremium(p){const f=FREQ[p.freq]||1;let mm=p.start,g=0;while(`${mm}-${pad(Math.min(p.day,lastDay(mm)))}`<TODAY&&g++<200)mm=addMonths(mm,f);return`${mm}-${pad(Math.min(p.day,lastDay(mm)))}`}
function healthView(){
  const ps=polInView(),people=isMe()?[ME()]:S.settings.earners;
  const monthlyPrem=sum(ps,p=>p.premium/(FREQ[p.freq]||1)*wOwner(p.owner));
  const hc=sum(ps.filter(p=>p.type==='HMO'||p.type==='Critical illness'),p=>p.coverage),life=sum(ps.filter(p=>p.type==='Life'),p=>p.coverage);
  const mf=goalsInView().find(g=>g.icon==='pulse'),inc=calc('month').income;
  const tips=[];
  people.forEach(n=>{const ai=annualIncome(n),lc=sum(S.policies.filter(p=>p.owner===n&&p.type==='Life'),p=>p.coverage),hm=sum(S.policies.filter(p=>p.owner===n&&p.type==='HMO'),p=>p.coverage);
    if(ai&&lc<ai*10)tips.push({i:'shield',tone:'warn',h:`<b>${esc(n)}</b>'s life cover is <span class="pv">${peso(lc)}</span>. A common rule is 10× yearly income ≈ <b class="pv">${peso(ai*10)}</b> — most important once someone depends on that income.`});
    if(hm&&hm<200000)tips.push({i:'pulse',tone:'info',h:`<b>${esc(n)}</b>'s HMO limit is <span class="pv">${peso(hm)}</span> per illness. Hospital bills can go past this — a medical fund or higher-limit plan fills the gap.`});
    if(!hm)tips.push({i:'pulse',tone:'bad',h:`<b>${esc(n)}</b> has no HMO on file. Add the company HMO or a personal plan.`});});
  if(!mf)tips.push({i:'heart',tone:'warn',h:'No medical emergency fund yet. Aim for <b>₱50,000 per person</b> on top of your HMO, for deductibles, meds and things HMOs don\'t cover.',act:'mkMedFund'});
  if(inc&&monthlyPrem/inc>.1)tips.push({i:'alert',tone:'warn',h:`Premiums take <b>${Math.round(monthlyPrem/inc*100)}%</b> of income — above the ~10% comfort zone. Check for overlapping plans.`});
  return`<section class="hero"><div><div class="hlabel" style="margin-top:0">Protection · ${isMe()?'mine + joint':'household'}</div><div class="hbig">${cnt('hcov',hc)}</div><div class="hsub">health coverage on file (HMO & critical illness limits)</div>
    <div class="hstats"><div class="hstat"><span>Life cover</span><b>${cnt('hlife',life)}</b></div><div class="hstat"><span>Premiums / month</span><b>${cnt('hprem',Math.round(monthlyPrem))}</b></div>
    <div class="hstat"><span>Plans on file</span><b>${ps.length}</b></div><div class="hstat gold"><span>Medical fund</span><b>${mf?cnt('hmf',goalSaved(mf)):'Not set'}</b></div></div></div></section>
  <div class="grid g2">
    <div class="card"><h3 style="display:flex;gap:8px;align-items:center">${ico('insight',17)}Coverage check</h3><div class="sub">How your protection compares with common planner rules of thumb</div>
      ${tips.length?tips.map(x=>`<div class="ins ${x.tone}"><div class="ii">${ico(x.i,17)}</div><div>${x.h}</div>${x.act?`<button class="btn ghost sm" style="flex:none" data-act="${x.act}">Create</button>`:'<span></span>'}</div>`).join(''):`<div class="ins good"><div class="ii">${ico('check',17)}</div><div>Coverage looks solid against the usual rules of thumb.</div><span></span></div>`}</div>
    <div class="card"><h3>Per person</h3><div class="sub">Health & life cover by person</div>
      ${people.map(n=>{const hm=sum(S.policies.filter(p=>p.owner===n&&(p.type==='HMO'||p.type==='Critical illness')),p=>p.coverage),lc=sum(S.policies.filter(p=>p.owner===n&&p.type==='Life'),p=>p.coverage),ai=annualIncome(n);
        return`<div class="person" style="margin-bottom:10px"><div class="ph"><div class="av" style="--c:#10B981">${esc(initials(n))}</div><b>${esc(n)}</b></div>
        <div class="meters"><div class="meter"><div class="mh">${ico('pulse',14)}<span>Health</span><b class="pv">${peso(hm)}</b></div><div class="bar" style="--c:#10B981;height:7px"><i style="width:${Math.min(100,hm/300000*100)}%"></i></div><div class="mf">aim ₱300,000+</div></div>
        <div class="meter"><div class="mh">${ico('shield',14)}<span>Life</span><b class="pv">${peso(lc)}</b></div><div class="bar" style="--c:#5B8DEF;height:7px"><i style="width:${ai?Math.min(100,lc/(ai*10)*100):0}%"></i></div><div class="mf">guide <span class="pv">${ai?peso(ai*10):'—'}</span> (10× yearly)</div></div></div></div>`}).join('')}</div>
  </div>
  <div class="grid g3">${ps.map(p=>{const col=POL_COL[p.type]||'#94A39B',nd=p.premium>0?nextPremium(p):null;return`<div class="card pol"><div style="display:flex;gap:12px;align-items:center"><div class="gico" style="--c:${col}">${ico(POL_ICON[p.type]||'dots',22)}</div><div style="min-width:0"><div style="font-weight:700;font-size:15px">${esc(p.name)}</div><div class="meta">${esc(p.type)} · ${esc(p.owner)} · ${esc(p.provider)}</div></div></div>
    <div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:14px" class="num pv">${p.coverage?peso(p.coverage):'—'}</div><div class="meta">${p.type==='Life'?'death benefit':p.type==='HMO'?'max benefit limit':'coverage'}</div>
    <div style="margin-top:10px"><div class="kv"><span>Premium</span><b class="pv">${p.premium?`${peso(p.premium)} / ${p.freq.replace('-',' ')}`:esc(p.notes||'—')}</b></div>${nd?`<div class="kv"><span>Next due</span><b>${dLabel(nd)}</b></div>`:''}${p.notes&&p.premium?`<div class="kv"><span>Notes</span><b>${esc(p.notes)}</b></div>`:''}</div>
    <div class="btnrow"><button class="btn ghost sm" data-act="openPolicy" data-id="${p.id}">Edit</button></div></div>`}).join('')}<button class="addcard" style="aspect-ratio:auto;min-height:160px" data-act="openPolicy">+ Add HMO, insurance or plan</button></div>`;
}

let addMode='spend',draft={cat:'Needs',method:'GCash'},sheetId=null,dAcct=null,delArm=null;
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
function defaultDate(){return S.ui.month===CURM?TODAY:`${S.ui.month}-01`}
function openAdd(mode,id,pre){addMode=mode||'spend';sheetId=id||null;delArm=null;if(addMode==='spend'){Object.assign(draft,{sub:null,desc:'',date:null,shared:false,by:(SB||isMe())?ME():S.settings.earners[0],acct:draft.acct&&S.wallet.some(w=>w.id===draft.acct)?draft.acct:''},pre||{});const ok=S.wallet.find(w=>w.id===draft.acct);if(ok&&draft.by!=='Joint'&&ok.owner!==draft.by)draft.acct=''}renderSheet();scrim.classList.add('show');setTimeout(()=>{const f=sheet.querySelector('.bigamt');f&&f.focus()},60)}
function closeAdd(){scrim.classList.remove('show')}
function payFromChips(){
  const by=draft.by||(isMe()?ME():S.settings.earners[0]);

  const cur=draft.acct||'';

}
function keepRender(){const f=k=>{const e=sheet.querySelector(k);return e?e.value:null};const a=f('#fa'),d=f('#fd'),dt=f('#fdt'),ti=f('#ft'),sb=f('#fs');if(d!==null)draft.desc=d;if(dt)draft.date=dt;if(sb)draft.sub=sb;renderSheet();const fa=sheet.querySelector('#fa');if(fa&&a)fa.value=a;const ft=sheet.querySelector('#ft');if(ft&&ti)ft.value=ti}

function renderListSheet(){

  let extra='';
  if(L.cat){const subs={};items.forEach(t=>subs[t.sub]=(subs[t.sub]||0)+t.amount*wTx(t));const mx=Math.max(1,...Object.values(subs));
    extra=`<div style="margin:6px 0 14px">${Object.entries(subs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sbar" style="--c:${CC[L.cat]}" data-tip="${esc(`${k} · <b>${tipAmt(v)}</b> · ${Math.round(v/tot*100)}%`)}"><span>${esc(k)}</span><div class="t"><i style="width:${v/mx*100}%"></i></div><b class="num pv" style="text-align:right">${peso(v)}</b></div>`).join('')}</div>`;
    if(L.alloc!=null)extra=`<div class="kv"><span>Allocated</span><b class="num pv">${peso(L.alloc)}</b></div><div class="kv"><span>${L.cat==='Savings'?'Saved':'Used'}</span><b class="num pv">${peso(tot)}</b></div><div class="kv"><span>${tot>L.alloc?'Over by':'Left'}</span><b class="num pv" style="color:${tot>L.alloc&&L.cat!=='Savings'?'var(--red)':'var(--green)'}">${peso(Math.abs(L.alloc-tot))}</b></div><div class="bar" style="--c:${CC[L.cat]};margin-bottom:14px"><i style="width:${Math.min(100,L.alloc?tot/L.alloc*100:0)}%"></i></div>`+extra;}

  <div class="txlist">${items.length?items.map(t=>txRow(t,true)).join(''):'<div class="empty">Nothing here yet</div>'}</div>`;
  reapplyReveals();

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(!S)return;
  const el=e.target.closest('[data-reveal],[data-view],[data-scope],[data-act],[data-day],[data-cat],[data-acct],[data-method],[data-mode],[data-who],[data-gicon],[data-gcolor],[data-quick]');
  if(!el)return;
  if(el.dataset.reveal){const id=el.dataset.reveal;revealed[id]?hide(id):reveal(id);return}
  if(el.dataset.who){
    if(el.dataset.who==='me'){if(isMe())return;if(unlocked&&hasPin()){goMe();return}openLock(hasPin()?'unlock':'create',goMe);return}
    if(isMe()){unlocked=false;S.ui.who='house';render();toast(hasPin()?`Back to Household · ${esc(ME())}'s dashboard locked`:'Showing the household budget')}return}
  if(el.dataset.gicon){goalFromForm();dGoal.icon=el.dataset.gicon;renderSheet();return}
  if(el.dataset.gcolor){goalFromForm();dGoal.color=el.dataset.gcolor;renderSheet();return}
  if(el.dataset.quick){const f=sheet.querySelector('#fa');f.value=(parseFloat(f.value)||0)+(+el.dataset.quick);return}
  if(el.dataset.view){S.ui.view=el.dataset.view;if(scrim.classList.contains('show'))closeAdd();render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(el.dataset.scope){S.ui.scope=el.dataset.scope;render();return}
  if(el.dataset.day){S.ui.day=el.dataset.day;render();return}
  if(el.dataset.cat){draft.cat=el.dataset.cat;draft.sub=null;keepRender();return}
  if(el.dataset.acct!==undefined){draft.acct=el.dataset.acct;sheet.querySelectorAll('[data-acct]').forEach(b=>b.classList.toggle('on',b===el));return}
  if(el.dataset.method){draft.method=el.dataset.method;sheet.querySelectorAll('[data-method]').forEach(b=>b.classList.toggle('on',b===el));return}
  if(el.dataset.mode&&!el.dataset.act){addMode=el.dataset.mode;renderSheet();return}
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='prevM'||a==='nextM'){const[y,mo]=S.ui.month.split('-').map(Number);const d=new Date(y,mo-1+(a==='nextM'?1:-1),1);S.ui.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;ensureMonth(S.ui.month);render()}
  else if(a==='privacy'){S.ui.privacy=!S.ui.privacy;render();toast(S.ui.privacy?'Privacy mode on — totals are blurred':'Privacy mode off')}
  else if(a==='openAdd')openAdd(el.dataset.mode);
  else if(a==='quickLog'){const sub=el.dataset.sub,who=el.dataset.pp;openAdd('spend',null,{cat:'Needs',sub,by:who,desc:sub==='Transport fare'?'Fare':'Baon / meal',date:el.dataset.date,acct:''})}
  else if(a==='cat'){const cat=el.dataset.c,whole=!!el.dataset.scopeM,sc=whole?'month':S.ui.scope,c=calc(sc);
    listSpec={cat,title:cat,sub:`${whole?mName(S.ui.month):scopeName()} · ${CDESC[cat]}`,alloc:c.alloc[cat],items:()=>calc(sc).tx.filter(t=>t.cat===cat)};openAdd('list')}
  else if(a==='week'){const A=+el.dataset.a,B=+el.dataset.b,m=S.ui.month,inW=d=>d.slice(0,7)===m&&+d.slice(8)>=A&&+d.slice(8)<=B;
    listSpec={title:`${dLabel(`${m}-${pad(A)}`)} – ${dLabel(`${m}-${pad(Math.min(B,lastDay(m)))}`)}`,sub:'Cash flow for this week',items:()=>S.tx.filter(t=>inW(t.date)&&wTx(t)>0),inc:()=>S.income.filter(i=>inW(i.date)&&wInc(i)>0)};openAdd('list')}
  else if(a==='openDebt')openAdd('debt',id);
  else if(a==='openGoal'){dGoal=null;openAdd('goal',id)}
  else if(a==='payAs'){const d=S.dues.find(x=>x.id===id),pp=el.dataset.pp;if(!d)return;payDue(S,d,false,pp);closeAdd();render();toast(`✓ ${esc(d.name)} paid${pp!=='Joint'?` by ${esc(pp)}`:''} — <b>${peso(d.amount)}</b> deducted`)}
  else if(a==='openSettle')openAdd('settle');
  else if(a==='openPolicy')openAdd('policy',id);
  else if(a==='delPolicy'){if(delArm!==id){delArm=id;renderSheet();return}S.policies=S.policies.filter(x=>x.id!==id);S.dues=S.dues.filter(x=>!(x.insId===id&&!x.paid));closeAdd();render();toast('Plan removed')}
  else if(a==='applySplit'){const i=S.income.find(x=>x.id===id);if(!i)return;const msg=applySplit(i);render();toast(msg.length?`Split done · ${msg.join(' · ')}`:'Nothing to split into — add a goal or debt first')}

let unlocked=false,lastAct=Date.now(),L=null;
const lockEl=document.getElementById('lockscr');
async function hashPin(pin,salt){const data=new TextEncoder().encode(salt+':'+pin);try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=2166136261;for(const c of data){h^=c;h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(16)}
function openLock(mode,onOk){L={mode,buf:'',first:'',err:'',onOk,tries:L&&L.tries||0,until:L&&L.until||0};closeAdd();drawLock();lockEl.classList.add('show')}
function closeLock(){lockEl.classList.remove('show');L=null}
function drawLock(){
  if(!L)return;const n=L.mode==='unlock'?(S.sec.len||4):6;
  const T={unlock:[`${esc(ME())}'s dashboard is locked`,'Enter your PIN to open your personal budget'],create:['Create your PIN','4–6 digits. Your partner won\'t be able to open your dashboard without it.'],confirm:['Confirm your PIN','Type the same PIN again']}[L.mode];
  const wait=L.until>Date.now()?Math.ceil((L.until-Date.now())/1000):0;
  lockEl.innerHTML=`<div class="lockcard"><div class="lockico">${ico('lock',28)}</div><h2>${T[0]}</h2><p>${T[1]}</p>
    <div class="pins" id="pins">${Array.from({length:L.mode==='unlock'?n:Math.max(4,Math.min(6,L.buf.length+ (L.buf.length<6?1:0)))},(_,i)=>`<i class="${i<L.buf.length?'f':''}"></i>`).join('')}</div>
    <div class="lerr">${wait?`Too many tries — wait ${wait}s`:esc(L.err)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-pin="${d}">${d}</button>`).join('')}<button class="ghost" data-pin="x">Cancel</button><button data-pin="0">0</button><button class="ghost" data-pin="b" aria-label="Delete">${ico('backspace',24)}</button></div>
    <div class="lockfoot">${L.mode!=='unlock'?`<button class="go" data-pin="ok" ${L.buf.length<4?'disabled style="opacity:.4"':''}>${L.mode==='create'?'Next':'Save PIN'}</button>`:''}</div></div>`;
}
async function pinKey(k){
  if(!L)return;lastAct=Date.now();
  if(k==='x'){closeLock();return}
  if(L.until>Date.now()){drawLock();return}
  if(k==='b'){L.buf=L.buf.slice(0,-1);L.err='';drawLock();return}
  if(k==='ok'){if(L.buf.length<4)return;
    if(L.mode==='create'){L.first=L.buf;L.buf='';L.mode='confirm';drawLock();return}
    if(L.mode==='confirm'){if(L.buf!==L.first){L.buf='';L.mode='create';L.first='';L.err="PINs didn't match — try again";drawLock();shakePins();return}
      const salt=uid()+uid();S.sec.salt=salt;S.sec.len=L.buf.length;S.sec.hash=await hashPin(L.buf,salt);save();const f=L.onOk;closeLock();unlocked=true;f&&f();toast('PIN saved — your dashboard is now private');return}}
  if(!/^\d$/.test(k))return;
  if(L.buf.length>=(L.mode==='unlock'?(S.sec.len||4):6))return;
  L.buf+=k;L.err='';drawLock();
  if(L.mode==='unlock'&&L.buf.length===(S.sec.len||4)){
    const h=await hashPin(L.buf,S.sec.salt);
    if(h===S.sec.hash){L.tries=0;const f=L.onOk;closeLock();unlocked=true;lastAct=Date.now();f&&f()}
    else{L.tries++;L.buf='';L.err=`Wrong PIN${L.tries>=3?` · ${5-L.tries>0?5-L.tries+' tries left':''}`:''}`;if(L.tries>=5){L.until=Date.now()+30000;L.tries=0;const iv=setInterval(()=>{if(!L||L.until<=Date.now()){clearInterval(iv)}drawLock()},1000)}drawLock();shakePins()}
  }
}
function shakePins(){const p=document.getElementById('pins');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}}
function lockNow(msg){unlocked=false;if(isMe()){S.ui.who='house';closeAdd();render()}toast(msg||`${esc(ME())}'s dashboard locked`)}

});

document.addEventListener('scroll',()=>{tip.classList.remove('show');tipEl=null},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
